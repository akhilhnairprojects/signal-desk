name: publish-snapshot

# Publishes a versioned, self-describing snapshot of the scored universe to
# docs/data/, served over GitHub Pages.
#
# Deliberately NOT given SUPABASE_URL / SUPABASE_KEY. Without them the pipeline
# reads the committed CSVs, which makes every snapshot reproducible from the
# repository alone and guarantees this job cannot touch the live database.

on:
  schedule:
    - cron: "40 5 1 * *"      # 1st of the month, before the other jobs
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: "Snapshot id (default: current YYYY-MM)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the snapshot
        run: |
          if [ -n "${{ inputs.snapshot_id }}" ]; then
            python scripts/publish_snapshot.py --id "${{ inputs.snapshot_id }}"
          else
            python scripts/publish_snapshot.py
          fi

      - name: Commit if anything changed
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to commit."
          else
            git commit -m "Publish snapshot $(date -u +%Y-%m)"
            git push
          fi
