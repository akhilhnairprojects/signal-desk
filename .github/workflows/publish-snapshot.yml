name: publish-snapshot

# Publishes a versioned, self-describing snapshot of the scored universe to
# docs/data/, served over GitHub Pages, plus the segmentation cache the app
# reuses to skip a ~60s cold start.
#
# Supabase credentials are used READ-ONLY, to mirror the database into the
# data/ CSVs before building. Without that step the snapshot is built from
# stale mirrors, its signal matrix differs from production, and the app's
# segmentation fingerprint never matches - which is exactly what happened on
# the first run (152 measured_signals rows existed only in the database).
#
# Mirroring first keeps both properties: the snapshot matches what the
# deployed app computes, and the committed CSVs still reproduce it offline.
# If the secrets are absent the job degrades gracefully and builds from the
# committed CSVs.

on:
  schedule:
    - cron: "40 5 1 * *"      # 1st of the month, before the other jobs
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: "Snapshot id (default: current YYYY-MM)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Mirror the database and build the snapshot
        run: |
          if [ -n "${{ inputs.snapshot_id }}" ]; then
            python scripts/publish_snapshot.py --mirror --id "${{ inputs.snapshot_id }}"
          else
            python scripts/publish_snapshot.py --mirror
          fi

      - name: Commit the mirrors and the snapshot together
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to commit."
          else
            git commit -m "Publish snapshot $(date -u +%Y-%m)"
            git push
          fi
