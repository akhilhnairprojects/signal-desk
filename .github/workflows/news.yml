# Nightly news scraping & scoring (per the automation schedule).
# Fetches the latest coverage for every account - baseline and user-added -
# plus competitor headlines, recalculates scores, sends tier-change alerts
# if notification channels are configured, and commits. Streamlit Cloud
# redeploys automatically.
# Manual trigger: repo -> Actions -> "Nightly news collection" -> Run workflow.
name: Nightly news collection

on:
  schedule:
    - cron: "0 6 * * *"     # daily 06:00 UTC (~1-2 AM US Eastern)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Collect news signals
        run: python scripts/collect_news.py
      - name: Collect competitor news
        run: python scripts/collect_competitor_news.py
      - name: Recalculate account scores
        run: python scripts/run_pipeline.py
      - name: Send tier-change alerts (if channels configured)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python scripts/send_digest.py --alerts
      - name: Commit refreshed data and results
        run: |
          git config user.name "pipeline-bot"
          git config user.email "actions@github.com"
          git add data/ results/
          git diff --cached --quiet || git commit -m "Nightly news refresh"
          git push
